    <style>
      #gatze-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }

      #gatze-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .gatze-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .gatze-splash-wordmark {
        font-family: 'DM Sans', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #1a1a2e;
        margin: 0;
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7B5CF5;
        animation: gatze-bounce 1.2s ease-in-out infinite;
      }

      .dots span:nth-child(1) { background: #5D87FF; }
      .dots span:nth-child(2) { background: #7B5CF5; animation-delay: 0.2s; }
      .dots span:nth-child(3) { background: #49BEFF; animation-delay: 0.4s; }

      @keyframes gatze-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40%            { transform: scale(1);   opacity: 1;   }
      }
    </style>
